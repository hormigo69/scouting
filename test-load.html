<!DOCTYPE html>
<html>
<head>
    <title>Test JSON Loading</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        .success { color: green; }
        .error { color: red; }
        pre { background: #f5f5f5; padding: 10px; }
    </style>
</head>
<body>
    <h1>Test JSON Loading</h1>
    <div id="output"></div>
    
    <script>
        const output = document.getElementById('output');
        
        async function testLoad(filename) {
            output.innerHTML += `<h2>Testing: ${filename}</h2>`;
            try {
                const response = await fetch(filename);
                output.innerHTML += `<p class="success">✓ HTTP ${response.status} ${response.statusText}</p>`;
                
                const data = await response.json();
                output.innerHTML += `<p class="success">✓ JSON parsed successfully</p>`;
                output.innerHTML += `<pre>${JSON.stringify({
                    hasMetadata: 'metadata' in data,
                    hasFields: 'fields' in data,
                    fieldsCount: data.fields ? data.fields.length : 0,
                    firstFieldId: data.fields && data.fields[0] ? data.fields[0].id : 'N/A',
                    firstFieldName: data.fields && data.fields[0] ? data.fields[0].name : 'N/A'
                }, null, 2)}</pre>`;
                
                return data;
            } catch (error) {
                output.innerHTML += `<p class="error">✗ Error: ${error.message}</p>`;
                console.error(error);
                return null;
            }
        }
        
        async function runTests() {
            await testLoad('Challenge request economia circular.json');
            await testLoad('ai-review-economia-circular.json');
            await testLoad('economia_circular.json');
        }
        
        runTests();
    </script>
</body>
</html>
